  dataloader:
    type: MindDataset
    dataset_files: /home/qs50063523/mycode/parallelsearch/.npu-calibration/train_dataset
    column_names:
    - input_ids
    - labels
    - loss_mask
    - position_ids
    shuffle: false
  drop_remainder: true
  num_parallel_workers: 8
  prefetch_size: 1
  numa_enable: false
model:
  model_type: deepseek_v3
  architectures: DeepseekV3ForCausalLM
  vocab_size: 129280
  seq_length: 4096
  hidden_size: 1792
  intermediate_size: 3072
  num_hidden_layers: 32
