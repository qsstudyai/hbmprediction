  save_max: 1
  no_save_optim: true
  load_path: ''
training:
  steps: 36
  local_batch_size: 2
  global_batch_size: 4
  max_norm: 1.0
  seed: 42
  deterministic: true
optimizer:
  type: AdamW
  betas:
  - 0.9
